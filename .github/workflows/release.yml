name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG=${GITHUB_REF#refs/tags/}
            VERSION=${TAG#v}
          else
            VERSION="2.0-$(date +%Y%m%d)"
            TAG="v$VERSION"
          fi
          APK_VERSION="${VERSION%%-*}-r${VERSION##*-}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_version=$APK_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build ipk
        run: bash scripts/build.sh "${{ steps.ver.outputs.version }}"

      - name: Build apk (via Alpine Docker)
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:edge sh -c '
            set -e
            echo "apk version:"; apk --version
            echo "Checking mkpkg subcommand:"
            apk mkpkg --help 2>&1 | head -5 || true
            apk mkpkg \
              --info "name:luci-app-sdutlogin" \
              --info "version:${{ steps.ver.outputs.apk_version }}" \
              --info "description:SDUT campus network auto login (AES encrypted portal protocol)" \
              --info "arch:noarch" \
              --info "license:GPL-2.0" \
              --info "origin:luci-app-sdutlogin" \
              --info "url:https://github.com/sggc/luci-app-sdutlogin" \
              --info "maintainer:sggc <sggc@users.noreply.github.com>" \
              --info "depends:openssl-util" \
              --script "post-install:post-install" \
              --files "data" \
              --output "luci-app-sdutlogin-${{ steps.ver.outputs.apk_version }}.apk"
            echo "Created luci-app-sdutlogin-${{ steps.ver.outputs.apk_version }}.apk"
            ls -lh *.apk
          '

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            *.ipk
            *.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            *.ipk
            *.apk
